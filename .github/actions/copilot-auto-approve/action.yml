name: 'Copilot Auto Approve'
description: 'Automatically approves PRs when GitHub Copilot code review generates 0 comments'
author: 'Project Zenith Systems'

inputs:
  github-token:
    description: 'GitHub token for approving PRs'
    required: true
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Check Copilot review and approve PR
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEW_BODY: ${{ github.event.review.body }}
        REVIEW_USER: ${{ github.event.review.user.login }}
        REVIEW_STATE: ${{ github.event.review.state }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        echo "Review by: $REVIEW_USER"
        echo "Review state: $REVIEW_STATE"

        # Check if the review is from GitHub Copilot
        if [[ "$REVIEW_USER" != "copilot-pull-request-reviewer[bot]" ]]; then
          echo "Review is not from Copilot (user: $REVIEW_USER), skipping..."
          exit 0
        fi

        # Check if the review state is 'commented' (Copilot always leaves a comment review, not approve/reject)
        if [[ "$REVIEW_STATE" != "commented" ]]; then
          echo "Review state is not 'commented' (state: $REVIEW_STATE), skipping..."
          exit 0
        fi

        # Check if the review body indicates 0 comments were generated
        # This pattern matches GitHub Copilot's standard review message format.
        # The message is typically: "GitHub Copilot code review generated 0 comments."
        # Using a partial match to be resilient to minor variations in punctuation or casing.
        if [[ "${REVIEW_BODY,,}" != *"generated 0 comments"* ]]; then
          echo "Copilot review did not generate 0 comments, skipping..."
          exit 0
        fi

        echo "Copilot code review generated 0 comments. Approving PR #$PR_NUMBER..."

        # Approve the PR via GitHub API
        # Capture curl exit code into CURL_EXIT_CODE without immediately failing the script
        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
          -d '{"event": "APPROVE", "body": "Automatically approved: Copilot code review generated 0 comments."}') || CURL_EXIT_CODE=$?
        CURL_EXIT_CODE=${CURL_EXIT_CODE:-0}

        if [ $CURL_EXIT_CODE -ne 0 ]; then
          echo "✗ Failed to call GitHub API (curl exit code: $CURL_EXIT_CODE)"
          exit 1
        fi

        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')

        # Validate HTTP_CODE is a number before comparison
        if ! [[ "$HTTP_CODE" =~ ^[0-9]+$ ]]; then
          echo "✗ Invalid HTTP response code: $HTTP_CODE"
          echo "$RESPONSE_BODY"
          exit 1
        fi

        if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
          echo "✓ PR #$PR_NUMBER has been approved"
        elif [ "$HTTP_CODE" -eq 403 ] || [ "$HTTP_CODE" -eq 404 ]; then
          echo "⚠ Cannot approve PR #$PR_NUMBER (HTTP $HTTP_CODE) - this may be expected for PRs from forks or restricted token permissions"
          echo "$RESPONSE_BODY"
          echo "Skipping approval (non-fatal)..."
          exit 0
        else
          echo "✗ Failed to approve PR #$PR_NUMBER (HTTP $HTTP_CODE)"
          echo "$RESPONSE_BODY"
          exit 1
        fi

branding:
  icon: 'check-circle'
  color: 'green'
